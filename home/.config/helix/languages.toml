[[language]]
name = "sql"
auto-format = true
formatter = { command = "uvx", args = ["sqlfluff", "format", "--nocolor", "-"] }

[[language]]
name = "python"
auto-format = false
comment-token = "#"
file-types = ["py", "pyi", "ipynb"]
language-servers = ["ruff", "ty"]
roots = ["pyproject.toml", "poetry.lock", ".git", ".venv/"]
formatter = { command = "sh", args = [
  "-c",
  "uvx ruff check --fix --select I - | uvx ruff check --fix - | uvx ruff format -",
] }

[language-server.ruff]
command = "uvx"
args = ["ruff", "server"]
environment = { "RUFF_TRACE" = "messages" }


[language-server.ty]
command = "uvx"
args = ["ty", "server"]

[language-server.ty.environment]
python = "./.venv"
